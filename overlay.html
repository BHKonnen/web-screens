<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Screens overlay</title>
  <style>
    /* No color-scheme meta on purpose: it must stay transparent over the map. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #root { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; backface-visibility: hidden; will-change: transform; }

    .screen iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; pointer-events: none; }
    .screen.hidden-gm { opacity: 0.35; outline: 8px dashed #f59e0b; }
    .screen.editing { visibility: hidden; }
    /* Interact mode: the page itself must receive mouse input. */
    body.interactive .screen, body.interactive .screen iframe { pointer-events: auto; }
    body.interactive { cursor: grab; }
    body.interactive.panning { cursor: grabbing; }
    #bar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: auto; cursor: default;
           display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 14px; border-radius: 999px;
           background: rgba(30, 33, 48, .92); color: #e5e7eb; font: 13px system-ui, sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
    #bar[hidden] { display: none; }
    #exit { padding: 6px 14px; border: 0; border-radius: 999px; background: #4f8cff; color: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="bar" hidden><span id="hint">Interact mode</span><button id="exit">Done</button></div>
  <script type="module" src="/src/overlay/main.ts"></script>
</body>
</html>
